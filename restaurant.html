<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Savr | Restaurant Portal</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f9fafc;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #27ae60;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p { color: #555; font-size: 1.1rem; margin-bottom: 30px; }
    form {
      max-width: 320px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 px 12px rgba(0,0,0,0.1);
    }
    input, button {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    font-size: 1rem;
    }

    input {
    margin: 10px 0;
    border: 1px solid #ccc;
    }

    button {
    background: #27ae60;
    color: #fff;
    border: none;
    cursor: pointer;
    }
    button:hover {
      background: #219150;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #3498db;
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h1>Welcome, Restaurant 🍽️</h1>
  <p>Here you’ll soon be able to list your extra meals and connect with customers.</p>
  <h2>Restaurant Sign In 🍴</h2>
  <form id="login-form">
    <input type="text" placeholder="Email or Username" name="email" required>
    <input type="password" placeholder="Password" name="password" required>

    <input type="hidden" name="role" value="restaurant">
    <button type="submit">Sign In</button>
    
    <a href="forgot-username.html">Forgot username?</a><br>
    <a href="forgot.html">Forgot password?</a>
    
  </form>
  <a href="signup.html">Don’t have an account? Sign Up</a><br>
  <a href="index.html">⬅ Back to Home</a>
  
  <script type="module" src="firebase.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
