<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAVR | Customer Dashboard</title>
  <style>
    body {
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #27ae60;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .restaurant-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .restaurant-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      width: 270px;
      padding: 20px;
      text-align: left;
      transition: transform 0.2s;
    }

    .restaurant-card:hover {
      transform: translateY(-4px);
    }

    .restaurant-card h3 {
      margin-bottom: 10px;
      color: #27ae60;
    }

    .restaurant-card p {
      font-size: 14px;
      color: #555;
    }

    .restaurant-card button {
      margin-top: 10px;
      background: #27ae60;
      border: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      transition: background 0.2s;
    }

    .restaurant-card button:hover {
      background: #219150;
    }

    #logoutBtn {
      display: block;
      margin: 40px auto;
      background: #e74c3c;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #logoutBtn:hover {
      background: #c0392b;
    }

    /* Empty state */
    .empty {
      text-align: center;
      color: #777;
      margin-top: 50px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Customer Dashboard</h1>
    <p>Browse restaurants offering surplus meals</p>
  </header>

  <main>
    <div class="restaurant-list" id="listingsContainer"></div>
    <div class="empty" id="emptyState">More listings coming soon...</div>
    <button id="logoutBtn">Logout</button>
  </main>

  <script type="module">
    import { db, logout } from "./firebase.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const listingsContainer = document.getElementById("listingsContainer");
    const emptyState = document.getElementById("emptyState");
    const logoutBtn = document.getElementById("logoutBtn");

    // Stripe public key (frontend only)
    const stripe = Stripe("pk_test_51SG03tImnxhK2hGwbcA0XDTsVLtNg38TBWhoh3XOJGXzzTMHix7fXWQdB5SxyGvhxUp0d8F8oGwFqj9uYaqAucTD006CZLyBl1");

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await logout();
      window.location.href = "login.html";
    });

    // Load restaurant listings from Firestore
    async function loadListings() {
      listingsContainer.innerHTML = "";
      const snapshot = await getDocs(query(collection(db,"listings"), orderBy("createdAt","desc")));

      if(snapshot.empty) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      snapshot.forEach(doc => {
        const data = doc.data();
        const card = document.createElement("div");
        card.className = "restaurant-card";
        card.innerHTML = `
          <h3>${data.restaurantName}</h3>
          <p>${data.itemName} — $${data.price} (${data.stock} left)</p>
          <button class="order-btn" data-name="${data.itemName}" data-price="${data.price}">Order Now</button>
        `;
        listingsContainer.appendChild(card);
      });

      // Add click event for all order buttons
      document.querySelectorAll(".order-btn").forEach(button => {
        button.addEventListener("click", async () => {
          const itemName = button.dataset.name;
          const price = button.dataset.price;

          try {
            const res = await fetch("http://localhost:4242/create-checkout-session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ itemName, price })
            });

            const session = await res.json();
            stripe.redirectToCheckout({ sessionId: session.id });
          } catch(err) {
            console.error(err);
            alert("Failed to start checkout.");
          }
        });
      });
    }

    loadListings();
  </script>

  <script src="https://js.stripe.com/v3/"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="logout.js"></script>
</body>
</html>
