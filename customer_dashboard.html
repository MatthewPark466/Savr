<script src="https://js.stripe.com/v3/"></script>
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { logout } from "./firebase.js";

const listingsContainer = document.getElementById("listingsContainer");
const emptyState = document.getElementById("emptyState");
const logoutBtn = document.getElementById("logoutBtn");

// Public key for frontend only
const stripe = Stripe("pk_test_51SG03tImnxhK2hGwbcA0XDTsVLtNg38TBWhoh3XOJGXzzTMHix7fXWQdB5SxyGvhxUp0d8F8oGwFqj9uYaqAucTD006CZLyBl1"); // ← frontend

logoutBtn.addEventListener("click", async () => {
  await logout();
  window.location.href = "login.html";
});

async function loadListings() {
  listingsContainer.innerHTML = "";
  const snapshot = await getDocs(query(collection(db,"listings"), orderBy("createdAt","desc")));

  if(snapshot.empty) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  snapshot.forEach(doc => {
    const data = doc.data();
    const card = document.createElement("div");
    card.className = "restaurant-card";
    card.innerHTML = `
      <h3>${data.restaurantName}</h3>
      <p>${data.itemName} — $${data.price} (${data.stock} left)</p>
      <button class="order-btn" data-name="${data.itemName}" data-price="${data.price}">Order Now</button>
    `;
    listingsContainer.appendChild(card);
  });

  document.querySelectorAll(".order-btn").forEach(button => {
    button.addEventListener("click", async () => {
      const itemName = button.dataset.name;
      const price = button.dataset.price;

      try {
        const res = await fetch("http://localhost:4242/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ itemName, price })
        });

        const session = await res.json();
        // Redirect to Stripe checkout using public key
        stripe.redirectToCheckout({ sessionId: session.id });
      } catch(err) {
        console.error(err);
        alert("Failed to start checkout.");
      }
    });
  });
}

loadListings();
</script>
